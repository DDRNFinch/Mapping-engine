<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fb6262">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Naxos">
  <title>Naxos · Evidence Matrix</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=4">
  <link rel="stylesheet" href="./styles.css?v=4">
  <style>
    .matrix-controls{display:grid;grid-template-columns:2fr 1.3fr 1.3fr 1.5fr;gap:.75rem;padding:14px;margin-bottom:16px}.matrix-controls label{display:block;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}.matrix-controls input,.matrix-controls select{width:100%}.matrix-wrap{overflow:auto;max-height:68vh}.matrix-table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}.matrix-table th,.matrix-table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:.65rem;text-align:center;vertical-align:middle}.matrix-table th{position:sticky;top:0;z-index:3;font-size:.77rem}.matrix-table th:first-child,.matrix-table td:first-child{position:sticky;left:0;text-align:left;background:#fff;z-index:2;min-width:235px}.matrix-table th:first-child{z-index:4}.matrix-table tr:last-child td{border-bottom:0}.matrix-table th:last-child,.matrix-table td:last-child{border-right:0}.criterion-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800}.criterion-text{display:block;color:var(--muted);font-size:.76rem;line-height:1.35;margin-top:.25rem;max-width:520px}.matrix-dot{width:36px;height:36px;border-radius:50%;padding:0;min-height:36px;display:inline-grid;place-items:center;font-size:.72rem;box-shadow:none}.matrix-dot.empty{cursor:default}.matrix-dot strong{font-size:.85rem}.matrix-summary{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:.82rem}.matrix-detail{padding:16px;margin-top:16px}.matrix-detail h2{margin-bottom:.35rem}.task-hit{padding:.75rem;margin-top:.6rem}.task-hit p{margin:.25rem 0 0;color:var(--muted);font-size:.82rem}.route-name{display:block;font-size:.68rem;color:var(--muted);font-weight:600;margin-top:.2rem}.facet-list{margin:.65rem 0 0;padding-left:1.15rem}.facet-list li{margin:.35rem 0;font-size:.84rem}.mini-chip{display:inline-block;padding:.2rem .45rem;border:1px solid var(--line);border-radius:999px;font-size:.7rem;margin-right:.3rem;background:#fff}
    @media(max-width:900px){.matrix-controls{grid-template-columns:1fr 1fr}.matrix-wrap{max-height:none}}
    @media(max-width:560px){.matrix-controls{grid-template-columns:1fr}.matrix-table th:first-child,.matrix-table td:first-child{min-width:180px}}
  </style>
  <script defer src="./pwa.js?v=4"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-heading">
      <a class="brand-logo-link" href="index.html" aria-label="Naxos Mapping Engine home"><img class="brand-logo" src="naxos-logo.svg?v=4" alt="Naxos Mapping Engine"></a>
      <div class="brand-copy">
        <p class="brand-kicker">Naxos · Mapping Engine</p>
        <h1>Evidence Matrix</h1>
        <p>Fast evidence navigation for assessor, IQA and EQA</p>
        <nav class="engine-nav"><a href="index.html">NVQ courses</a><a href="ksb.html">KSB courses</a><a class="active" href="matrix.html">Evidence matrix</a></nav>
      </div>
    </div>
  </header>
  <main>
    <section class="matrix-controls">
      <div><label for="courseSelect">Course</label><select id="courseSelect"></select></div>
      <div id="routeControl"><label for="routeSelect">Pathway / optional unit</label><select id="routeSelect"></select></div>
      <div><label for="groupSelect" id="groupLabel">Unit / KSB type</label><select id="groupSelect"></select></div>
      <div><label for="matrixSearch">Find criterion</label><input id="matrixSearch" type="search" placeholder="e.g. 235.1.1 or S11"></div>
    </section>
    <section id="matrixStatus" class="status-panel" aria-live="polite"></section>
    <div class="matrix-summary" id="matrixSummary"></div>
    <section class="matrix-wrap"><table class="matrix-table"><thead id="matrixHead"></thead><tbody id="matrixBody"></tbody></table></section>
    <section id="matrixDetail" class="matrix-detail" hidden></section>
  </main>
  <footer><span>Naxos · Mapping Engine · Evidence matrix · click a dot to see the exact task and evidence route</span></footer>
  <script src="matrix.js?v=4"></script>
</body>
</html>
