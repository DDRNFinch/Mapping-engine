name: Apply compact KSB QR

on:
  push:
    paths:
      - '.github/workflows/apply-compact-ksb-qr-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply compact QR patch
        run: python .github/scripts/apply_compact_ksb_qr.py
      - name: Validate JavaScript
        run: node --check ksb.js && node --check naxos-editor.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ksb.js ksb.html styles.css
          git diff --cached --quiet || git commit -m "Use compact KSB customisation QR patch"
          git push
