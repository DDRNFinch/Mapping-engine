name: Apply approved Naxos learning hours
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-learning-hours.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved learning-hours metadata
        run: python .github/patch-approved-learning-hours.py
      - name: Validate JSON and values
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=sorted(Path('packs').glob('6570-04-*-v1.json'))
          if len(files)!=6: raise SystemExit('Expected six 6570-04 route packs')
          for path in files:
              data=json.loads(path.read_text(encoding='utf-8'))
              learning=data.get('learning') or {}
              if learning.get('type')!='GLH' or learning.get('requiredHours')!=394:
                  raise SystemExit(f'Bad learning metadata in {path}')
          manifest=json.loads(Path('manifest-6570-04.json').read_text(encoding='utf-8'))
          if manifest.get('learning')!={'type':'GLH','requiredHours':394}: raise SystemExit('Manifest learning mismatch')
          catalog=json.loads(Path('course-catalog.json').read_text(encoding='utf-8'))
          item=next(x for x in catalog['courses'] if x['id']=='6570-04')
          if item.get('learning')!={'type':'GLH','requiredHours':394}: raise SystemExit('Catalog learning mismatch')
          PY
      - name: Remove temporary update files
        run: rm .github/patch-approved-learning-hours.py .github/workflows/apply-approved-learning-hours.yml
      - name: Verify scope
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'course-catalog.json','manifest-6570-04.json',
            'packs/6570-04-cladding-v1.json','packs/6570-04-concrete-v1.json','packs/6570-04-drainage-v1.json',
            'packs/6570-04-repair-v1.json','packs/6570-04-specialist-v1.json','packs/6570-04-thin-v1.json',
            '.github/patch-approved-learning-hours.py','.github/workflows/apply-approved-learning-hours.yml'
          }
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths=set()
          for row in rows:
              p=row[3:].strip()
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              paths.add(p)
          extra=paths-allowed
          if extra: raise SystemExit('Unexpected changed files: '+', '.join(sorted(extra)))
          required={'course-catalog.json','manifest-6570-04.json'}
          if not required.issubset(paths): raise SystemExit('Required Naxos metadata files not changed')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add verified Naxos learning-hours metadata
          file_pattern: 'course-catalog.json manifest-6570-04.json packs/6570-04-*-v1.json .github/patch-approved-learning-hours.py .github/workflows/apply-approved-learning-hours.yml'
