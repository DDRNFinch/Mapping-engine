name: Build Naxos Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare bundled web app
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'signing' \
            --exclude 'dist' \
            --exclude 'android' \
            --exclude 'node_modules' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'capacitor.config.*'

      - name: Create Capacitor Android project
        shell: bash
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Naxos Mapping Engine" "uk.co.nisia.naxos" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Apply Naxos Android identity
        shell: bash
        run: |
          cat > android/app/src/main/res/drawable/naxos_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
            <path android:fillColor="#FB6262" android:pathData="M0,0h512v512h-512z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="22" android:strokeLineCap="round" android:pathData="M256,96a160,160 0,1 0,0 320a160,160 0,1 0,0 -320"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="18" android:strokeLineCap="round" android:pathData="M229,217a29,29 0,1 0,0 58a29,29 0,1 0,0 -58"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="18" android:strokeLineCap="round" android:pathData="M318,229a29,29 0,1 0,0 58a29,29 0,1 0,0 -58"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('@mipmap/ic_launcher_round','@drawable/naxos_icon')
          s=s.replace('@mipmap/ic_launcher','@drawable/naxos_icon')
          s=s.replace('android:label="@string/app_name"','android:label="Naxos"')
          p.write_text(s)
          PY

      - name: Build and sign real Android APK
        shell: bash
        run: |
          base64 -d signing/naxos-release.keystore.b64 > /tmp/naxos-release.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/Naxos-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/naxos-release.keystore \
            --ks-key-alias naxos \
            --ks-pass pass:NaxosMapping2026 \
            --key-pass pass:NaxosMapping2026 \
            --out Naxos-Mapping-Engine.apk \
            /tmp/Naxos-aligned.apk
          "$APKSIGNER" verify --verbose Naxos-Mapping-Engine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naxos-Mapping-Engine-Android
          path: Naxos-Mapping-Engine.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Naxos-Mapping-Engine.apk --clobber
          else
            gh release create android-latest Naxos-Mapping-Engine.apk \
              --title "Naxos Mapping Engine — Android" \
              --notes "Installable Android APK for Naxos Mapping Engine. This is a real Android application package, not a browser shortcut."
          fi
