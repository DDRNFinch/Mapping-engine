<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Naxos Mapping Engine logo</title>
  <desc id="desc">Soft red rounded square with a white circular face and two white oo eyes looking toward the lower right.</desc>
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7772"/>
      <stop offset="0.55" stop-color="#ff6463"/>
      <stop offset="1" stop-color="#f6585c"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="42%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#coral)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#softGlow)"/>
  <circle cx="256" cy="265" r="164" fill="none" stroke="#fff" stroke-width="22"/>
  <circle cx="229" cy="246" r="29" fill="none" stroke="#fff" stroke-width="18"/>
  <circle cx="318" cy="258" r="29" fill="none" stroke="#fff" stroke-width="18"/>
</svg>
